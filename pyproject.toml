[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "notey"
version = "0.1.0"
description = "Local semantic search over Mac Notes"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "requests>=2.31",
    "python-dateutil>=2.9",
]

[project.scripts]
notey = "notey.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notey*"]
